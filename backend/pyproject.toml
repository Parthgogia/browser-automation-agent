[project]
name = "browser-automation-agent"
version = "0.1.0"
description = "An LLM agent that operates a real web browser to complete tasks described in natural language."
requires-python = ">=3.12"
dependencies = [
    # --- web tier ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14",
    "python-multipart>=0.0.20",
    # --- config ---
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    # --- agent orchestration ---
    "langgraph>=0.3",
    "langgraph-checkpoint>=2.0",
    # --- llm (direct SDK; no LangChain model wrappers, see docs/ARCHITECTURE.md) ---
    "google-genai>=1.0",
    # --- browser ---
    "playwright>=1.49",
    # --- persistence ---
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "greenlet>=3.1",
    # --- misc ---
    "httpx>=0.28",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
# `agent "find the cheapest ..."` once the package is installed.
agent = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.browser" = ["js/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
